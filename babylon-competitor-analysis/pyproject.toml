[project]
name = "babylon-competitor-analysis"
version = "0.1.0"
description = "Babylon TBV Competitor Intelligence Dashboard"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.31.0",
    "pandas>=2.1.0",
    "plotly>=5.18.0",
    "numpy>=1.26.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
collect = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pycryptodome>=3.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
